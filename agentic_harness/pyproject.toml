[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-harness"
version = "0.2.0"
description = "Layered agentic harness built on LangGraph."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "langchain-openai>=0.3.0", "openai>=2.0.0", "jsonschema>=4.0", "langgraph>=1.2.11", "tavily-python>=0.5.0", "psycopg[binary]>=3.2.0", "langsmith>=0.8.4", "amplitude-analytics>=1.1.0"]

[project.optional-dependencies]
ibkr = [
    "google-auth>=2.30",
    "google-cloud-secret-manager>=2.20",
    "httpx>=0.27",
    "mcp @ git+https://github.com/joy-bagchi/mcp-python-sdk-read-scope-ceiling.git@2126cf050b8b2637b4fc22360f9243ad27678ffb",
    "starlette>=0.27",
    "uvicorn>=0.31.1",
]

[project.scripts]
agentic-harness-ibkr-oauth = "agentic_harness.ibkr_oauth:main"

[tool.setuptools.packages.find]
include = ["agentic_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
