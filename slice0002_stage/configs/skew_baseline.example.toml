# Slice 0001 application defaults.
instrument = "SPY"
metric_id = "spy_iv_skew_vix_scaled"
methodology_version = "v2"
market_timezone = "America/New_York"
exchange_calendar = "XNYS"
trading_session_dte = [1, 2]
# Half of the VIX-implied volatility over each trading-session DTE horizon.
# Run sigma_multiplier = 1.0 as a separate baseline series for full daily volatility.
sigma_multiplier = 0.5
annualization_trading_sessions = 252
strike_distance_policy = "vix_horizon_scaled_half_volatility"
iv_output_units = "percentage_points"
rolling_window_sessions = 26 # provisional/configurable, not an optimized choice
snapshot_selection_policy = "one_consistent_daily_snapshot"
allow_strike_interpolation = true
allow_strike_extrapolation = false

[inputs]
gcp_project = "marketphysics"
gcs_bucket = "marketphysics-market-manifold-data"
option_catalog_object = "market-manifold/option-chain-iv/manifests/catalog.json"
volatility_history_manifest_object = "market-manifold/vol-regime-history/manifests/latest.json"

[outputs]
# Slice 0001 writes the first immutable dated record here.
local_history_path = "./outputs/baseline-history"
# Slice 0002 configures durable production history; it must differ from source prefixes.
gcs_results_prefix = "gs://YOUR_RESULTS_BUCKET/YOUR_RESULTS_PREFIX"
